# Dependabot version updates (v1.86.0). Weekly, minor and patch updates grouped into one PR per
# ecosystem. Not a deploy gate and merged only by the owner.
# v1.87.0: PRs target `develop`, per this repo's git flow (feature -> develop -> master); the
# first run had opened them against master.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
