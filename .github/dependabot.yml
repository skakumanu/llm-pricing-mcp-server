# Dependabot version updates (v1.86.0). Weekly, minor and patch updates grouped into one PR per
# ecosystem. Not a deploy gate and merged only by the owner.
# v1.87.0: PRs target `develop`, per this repo's git flow (feature -> develop -> master); the
# first run had opened them against master.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v1.90.2: the OpenAI SDK is the live client for the production chat agent
      # (agent/llm_backend.py OpenAIBackend). Major bumps (1.x -> 2.x/3.x) change the
      # API and the test suite stubs the client, so CI cannot vouch for them. Take
      # them deliberately with a live re-check, not from an auto-opened PR; minor and
      # patch within the pinned major still flow.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
