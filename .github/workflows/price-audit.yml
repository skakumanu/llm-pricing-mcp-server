name: Weekly price audit

# Curated prices in STATIC_PRICING are hand-maintained and drift silently. A
# one-off audit found 12 wrong prices, several off by 3-16x, which had been
# serving live for months. Drift is now withheld from serving the moment it's
# detected on every request (see price_oracle.demote_drifted), not just when
# this job happens to run — this job's remaining purpose is to surface what's
# currently withheld so a human fixes STATIC_PRICING, rather than letting a
# withheld model quietly stay unpriced indefinitely.
#
# It also refreshes the vendored registry snapshot, which is the offline
# fallback and goes stale the same way.

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run drift audit
        id: audit
        run: |
          python - <<'PY' > audit.txt 2>/dev/null
          import asyncio, sys
          sys.path.insert(0, '.')
          from mcp.tools.check_price_drift import CheckPriceDriftTool

          async def main():
              r = await CheckPriceDriftTool().execute({"threshold_pct": 5, "limit": 200})
              if not r.get("success"):
                  print(f"AUDIT_FAILED: {r.get('error')}")
                  return
              print(f"COUNT={r['drift_count']}")
              print(f"CHECKED={r['models_checked']}")
              print()
              print(r["summary"])
              if r["findings"]:
                  print()
                  print("| Model | Provider | Ours ($/1M) | Registry ($/1M) | Diff | Direction |")
                  print("|---|---|---|---|---|---|")
                  for f in r["findings"]:
                      print(f"| `{f['model_name']}` | {f['provider']} | "
                            f"{f['our_input_cost_per_1m_usd']:.4f} | "
                            f"{f['registry_input_cost_per_1m_usd']:.4f} | "
                            f"{f['pct_difference']:.0f}% | {f['direction']} |")
          asyncio.run(main())
          PY

          cat audit.txt
          COUNT=$(grep -oP '^COUNT=\K\d+' audit.txt || echo "-1")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open an issue when drift is found
        if: steps.audit.outputs.count != '0' && steps.audit.outputs.count != '-1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Provision our own label rather than depending on someone having
          # created it by hand — gh issue create fails outright on an unknown
          # label, which would silently cost us the whole report. --force makes
          # this idempotent.
          gh label create price-drift \
            --description "Curated price disagrees with the reference registry" \
            --color D93F0B --force \
            || echo "Could not create the label; will attempt the issue without it."

          # Reuse a single rolling issue rather than filing a new one each week.
          EXISTING=$(gh issue list --state open --label price-drift \
            --json number --jq '.[0].number' || true)

          BODY=$(printf 'The weekly audit found curated prices that disagree with the reference registry.\n\nThese are already withheld from serving automatically (price_confirmed set to False the moment drift was detected) — they will not reach `estimate_cost`, `compare_costs`, `predict_cost`, `optimize_workload`, or the router until fixed.\n\n%s\n\n---\nRun `check_price_drift` locally to see current findings. Fix STATIC_PRICING to correct and restore these models.' "$(tail -n +2 audit.txt)")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            # Fall back to an unlabelled issue rather than losing the report.
            gh issue create \
              --title "Price drift detected: ${{ steps.audit.outputs.count }} model(s)" \
              --label price-drift \
              --body "$BODY" \
            || gh issue create \
              --title "Price drift detected: ${{ steps.audit.outputs.count }} model(s)" \
              --body "$BODY"
          fi

      - name: Report a clean audit
        if: steps.audit.outputs.count == '0'
        run: echo "No curated price differs from the registry by more than 5%."

      - name: Fail the run if the audit could not complete
        if: steps.audit.outputs.count == '-1'
        run: |
          echo "The audit did not produce a result — the registry was unreachable"
          echo "and the vendored snapshot was unusable."
          exit 1

  refresh-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the vendored snapshot
        run: |
          cp data/model_prices_snapshot.json /tmp/snapshot_before.json
          curl -sS --max-time 60 -o /tmp/registry.json \
            "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
          python - <<'PY'
          import json
          raw = json.load(open('/tmp/registry.json'))
          KEEP = ["input_cost_per_token","output_cost_per_token","cache_read_input_token_cost",
                  "max_input_tokens","max_output_tokens","supports_vision",
                  "supports_function_calling","litellm_provider","mode"]
          trim = {k: {f: v[f] for f in KEEP if f in v}
                  for k, v in raw.items()
                  if isinstance(v, dict) and v.get("mode") == "chat"
                  and "input_cost_per_token" in v}
          with open('data/model_prices_snapshot.json', 'w') as fh:
              json.dump(trim, fh, separators=(',', ':'), sort_keys=True)
          print(f"snapshot rebuilt: {len(trim)} models")
          PY

      # This PR is opened with GITHUB_TOKEN, and GitHub does not trigger workflow
      # runs for events created with that token — so it arrives with no CI at all.
      # Rather than depend on a long-lived PAT, the job that produces the data
      # proves the data is good, and refuses to open the PR otherwise.
      - name: Validate the rebuilt snapshot
        id: validate
        run: |
          if ! python scripts/validate_price_snapshot.py \
                 data/model_prices_snapshot.json \
                 --baseline /tmp/snapshot_before.json > /tmp/validation.md; then
            echo "::error::Rebuilt snapshot failed validation — not opening a PR."
            cat /tmp/validation.md
            git checkout -- data/model_prices_snapshot.json
            exit 1
          fi
          cat /tmp/validation.md

      - name: Prove the app still works against the new snapshot
        run: |
          # Exercise the code that actually consumes the file, not just its shape.
          python -m pytest tests/test_price_oracle.py tests/test_price_provenance.py -q

      - name: Open a PR when the snapshot changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/model_prices_snapshot.json; then
            echo "Snapshot unchanged — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ci/refresh-price-snapshot-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/model_prices_snapshot.json
          git commit -m "chore(pricing): refresh vendored price registry snapshot"
          git push origin "$BRANCH"

          # GitHub will not run CI on a PR opened with GITHUB_TOKEN, so state
          # plainly what was verified before it was opened — otherwise a reviewer
          # sees an empty check list and has no idea whether anything was checked.
          {
            printf 'Automated refresh of the offline price-registry fallback. Only `data/model_prices_snapshot.json` changes; no curated price is touched.\n\n'
            printf '## Verified before this PR was opened\n\n'
            printf 'GitHub does not trigger workflow runs for PRs created with `GITHUB_TOKEN`, so this PR shows no checks. These ran in the job that produced it:\n\n'
            printf -- '- `scripts/validate_price_snapshot.py` — schema, price sanity, and movement limits against the previous snapshot\n'
            printf -- '- `tests/test_price_oracle.py` and `tests/test_price_provenance.py` — the code that actually consumes this file\n\n'
            printf 'The PR is only opened when both pass.\n\n'
            printf '## What changed\n\n'
            cat /tmp/validation.md
          } > /tmp/pr_body.md

          gh pr create \
            --title "chore(pricing): refresh vendored price registry snapshot" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."
