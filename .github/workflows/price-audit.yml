name: Weekly price audit

# Curated prices in STATIC_PRICING are hand-maintained and drift silently. A
# one-off audit found 12 wrong prices, several off by 3-16x, which had been
# serving live for months. Drift is now withheld from serving the moment it's
# detected on every request (see price_oracle.demote_drifted), not just when
# this job happens to run — this job's remaining purpose is to surface what's
# currently withheld so a human fixes STATIC_PRICING, rather than letting a
# withheld model quietly stay unpriced indefinitely.
#
# It also refreshes the vendored registry snapshot, which is the offline
# fallback and goes stale the same way.
#
# v1.74.0 added two human-merged PRs (reconfirm stale prices; retire models),
# and v1.75.0 a third: pickup, which adds every chat model the registry prices
# under a registry-backed catalogue provider that the catalogue lacks, as a
# registry-sourced entry in data/registry_models/<slug>.json. Rollout is staged
# via --providers (the five v1.75.0 providers first; widen in later weeks).
#
# v1.76.0 adds a fourth: refresh-exchange-rates, which rewrites the vendored
# USD exchange-rate table data/exchange_rates.json (the server converts prices
# with that file and never fetches a rate per request; a table older than 7
# days is served flagged stale until this PR merges).

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run drift audit
        id: audit
        run: |
          python - <<'PY' > audit.txt 2>/dev/null
          import asyncio, sys
          sys.path.insert(0, '.')
          from mcp.tools.check_price_drift import CheckPriceDriftTool

          async def main():
              r = await CheckPriceDriftTool().execute({"threshold_pct": 5, "limit": 200})
              if not r.get("success"):
                  print(f"AUDIT_FAILED: {r.get('error')}")
                  return
              print(f"COUNT={r['drift_count']}")
              print(f"CHECKED={r['models_checked']}")
              print()
              print(r["summary"])
              if r["findings"]:
                  print()
                  print("| Model | Provider | Ours ($/1M) | Registry ($/1M) | Diff | Direction |")
                  print("|---|---|---|---|---|---|")
                  for f in r["findings"]:
                      print(f"| `{f['model_name']}` | {f['provider']} | "
                            f"{f['our_input_cost_per_1m_usd']:.4f} | "
                            f"{f['registry_input_cost_per_1m_usd']:.4f} | "
                            f"{f['pct_difference']:.0f}% | {f['direction']} |")
          asyncio.run(main())
          PY

          cat audit.txt
          COUNT=$(grep -oP '^COUNT=\K\d+' audit.txt || echo "-1")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Open an issue when drift is found
        if: steps.audit.outputs.count != '0' && steps.audit.outputs.count != '-1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Provision our own label rather than depending on someone having
          # created it by hand — gh issue create fails outright on an unknown
          # label, which would silently cost us the whole report. --force makes
          # this idempotent.
          gh label create price-drift \
            --description "Curated price disagrees with the reference registry" \
            --color D93F0B --force \
            || echo "Could not create the label; will attempt the issue without it."

          # Reuse a single rolling issue rather than filing a new one each week.
          EXISTING=$(gh issue list --state open --label price-drift \
            --json number --jq '.[0].number' || true)

          BODY=$(printf 'The weekly audit found curated prices that disagree with the reference registry.\n\nThese are already withheld from serving automatically (price_confirmed set to False the moment drift was detected) — they will not reach `estimate_cost`, `compare_costs`, `predict_cost`, `optimize_workload`, or the router until fixed.\n\n%s\n\n---\nRun `check_price_drift` locally to see current findings. Fix STATIC_PRICING to correct and restore these models.' "$(tail -n +2 audit.txt)")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            # Fall back to an unlabelled issue rather than losing the report.
            gh issue create \
              --title "Price drift detected: ${{ steps.audit.outputs.count }} model(s)" \
              --label price-drift \
              --body "$BODY" \
            || gh issue create \
              --title "Price drift detected: ${{ steps.audit.outputs.count }} model(s)" \
              --body "$BODY"
          fi

      - name: Report a clean audit
        if: steps.audit.outputs.count == '0'
        run: echo "No curated price differs from the registry by more than 5%."

      - name: Fail the run if the audit could not complete
        if: steps.audit.outputs.count == '-1'
        run: |
          echo "The audit did not produce a result — the registry was unreachable"
          echo "and the vendored snapshot was unusable."
          exit 1

  refresh-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the vendored snapshot
        run: |
          cp data/model_prices_snapshot.json /tmp/snapshot_before.json
          curl -sS --max-time 60 -o /tmp/registry.json \
            "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
          python - <<'PY'
          import json
          raw = json.load(open('/tmp/registry.json'))
          KEEP = ["input_cost_per_token","output_cost_per_token","cache_read_input_token_cost",
                  "max_input_tokens","max_output_tokens","supports_vision",
                  "supports_function_calling","litellm_provider","mode",
                  "deprecation_date"]  # v1.74.0: retirement withholding works offline too
          trim = {k: {f: v[f] for f in KEEP if f in v}
                  for k, v in raw.items()
                  if isinstance(v, dict) and v.get("mode") == "chat"
                  and "input_cost_per_token" in v}
          with open('data/model_prices_snapshot.json', 'w') as fh:
              json.dump(trim, fh, separators=(',', ':'), sort_keys=True)
          print(f"snapshot rebuilt: {len(trim)} models")
          PY

      # This PR is opened with GITHUB_TOKEN, and GitHub does not trigger workflow
      # runs for events created with that token — so it arrives with no CI at all.
      # Rather than depend on a long-lived PAT, the job that produces the data
      # proves the data is good, and refuses to open the PR otherwise.
      - name: Validate the rebuilt snapshot
        id: validate
        run: |
          if ! python scripts/validate_price_snapshot.py \
                 data/model_prices_snapshot.json \
                 --baseline /tmp/snapshot_before.json > /tmp/validation.md; then
            echo "::error::Rebuilt snapshot failed validation — not opening a PR."
            cat /tmp/validation.md
            git checkout -- data/model_prices_snapshot.json
            exit 1
          fi
          cat /tmp/validation.md

      - name: Prove the app still works against the new snapshot
        run: |
          # Exercise the code that actually consumes the file, not just its shape.
          python -m pytest tests/test_price_oracle.py tests/test_price_provenance.py -q

      - name: Open a PR when the snapshot changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/model_prices_snapshot.json; then
            echo "Snapshot unchanged — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ci/refresh-price-snapshot-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/model_prices_snapshot.json
          git commit -m "chore(pricing): refresh vendored price registry snapshot"
          git push origin "$BRANCH"

          # GitHub will not run CI on a PR opened with GITHUB_TOKEN, so state
          # plainly what was verified before it was opened — otherwise a reviewer
          # sees an empty check list and has no idea whether anything was checked.
          {
            printf 'Automated refresh of the offline price-registry fallback. Only `data/model_prices_snapshot.json` changes; no curated price is touched.\n\n'
            printf '## Verified before this PR was opened\n\n'
            printf 'GitHub does not trigger workflow runs for PRs created with `GITHUB_TOKEN`, so this PR shows no checks. These ran in the job that produced it:\n\n'
            printf -- '- `scripts/validate_price_snapshot.py` — schema, price sanity, and movement limits against the previous snapshot\n'
            printf -- '- `tests/test_price_oracle.py` and `tests/test_price_provenance.py` — the code that actually consumes this file\n\n'
            printf 'The PR is only opened when both pass.\n\n'
            printf '## What changed\n\n'
            cat /tmp/validation.md
          } > /tmp/pr_body.md

          gh pr create \
            --title "chore(pricing): refresh vendored price registry snapshot" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."

  # v1.76.0 — the vendored exchange-rate table. Same posture as the price
  # snapshot: works offline, tells you how old it is, refreshed by a PR a human
  # merges. The script validates (13 codes, positive, USD == 1, as_of not in
  # the future, no rate moved >15%) and on any failure leaves the file alone
  # and exits 0, so a flaky source never fails the audit run.
  refresh-exchange-rates:
    runs-on: ubuntu-latest
    needs: refresh-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh the vendored exchange-rate table
        run: python scripts/refresh_exchange_rates.py --apply | tee /tmp/exchange_rates.txt
      - name: Prove the app still converts with the new table
        run: python -m pytest tests/test_currency.py -q
      - name: Open a PR when the table changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/exchange_rates.json; then
            echo "Exchange-rate table unchanged — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/refresh-exchange-rates-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add data/exchange_rates.json
          git commit -m "chore(currency): refresh vendored exchange-rate table"
          git push origin "$BRANCH"
          {
            printf 'Automated weekly refresh of the vendored USD exchange-rate table (`scripts/refresh_exchange_rates.py`). Only `data/exchange_rates.json` changes; no price is touched. Converted amounts shown by the API and the browser pages are indicative — providers bill in USD.\n\n'
            printf '## Verified before this PR was opened\n\nGitHub does not run CI on PRs created with `GITHUB_TOKEN`; these ran in the job that produced it: the script'"'"'s own validation (all 13 supported codes present, positive and finite, USD == 1.0, as_of not in the future, no rate moved more than 15%% against the previous table) and `tests/test_currency.py`, the code that actually consumes this file.\n\n'
            printf '## Report\n\n'; cat /tmp/exchange_rates.txt; printf '\n'
          } > /tmp/pr_body.md
          gh pr create \
            --title "chore(currency): refresh vendored exchange-rate table" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."

  # v1.74.0 — the two loops the Oct 2026 reconfirmation pass showed were
  # missing. Both produce a PR for a human to merge; neither edits develop.
  #
  # reconfirm: stale prices that still match the registry (both input and
  #   output within the drift threshold) get today's price_as_of. Without
  #   this, staleness piled up to 139 models before anyone looked.
  # retire: models whose same-provider registry entry has a deprecation date
  #   at least 30 days in the past are deleted from STATIC_PRICING. The
  #   oracle already withholds them from cost math the day the date passes;
  #   the grace period gives an upstream registry mistake time to be fixed.
  reconfirm:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reconfirm stale prices that still match the registry
        run: python scripts/reconfirm_stale_prices.py --apply | tee /tmp/reconfirm.txt
      - name: Prove the catalogue still passes its guards
        run: python -m pytest tests/test_price_oracle.py tests/test_price_provenance.py tests/test_pricing_integrity.py -q
      - name: Open a PR when anything was stamped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/services; then
            echo "Nothing to reconfirm — no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/reconfirm-prices-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add src/services
          git commit -m "fix(pricing): reconfirm stale prices that still match the registry"
          git push origin "$BRANCH"
          {
            printf 'Automated weekly reconfirmation (`scripts/reconfirm_stale_prices.py`). Only `price_as_of` dates change — no price value is touched. Every stamped model matches its same-provider registry entry on input and output within the drift threshold.\n\n'
            printf '## Verified before this PR was opened\n\nGitHub does not run CI on PRs created with `GITHUB_TOKEN`; these ran in the job that produced it: `tests/test_price_oracle.py`, `tests/test_price_provenance.py`, `tests/test_pricing_integrity.py`.\n\n'
            printf '## Report\n\n```\n'; cat /tmp/reconfirm.txt; printf '\n```\n'
          } > /tmp/pr_body.md
          gh pr create \
            --title "fix(pricing): reconfirm stale prices that still match the registry" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."

  retire:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Report retired, scheduled and candidate models
        run: python scripts/retire_models.py --markdown | tee /tmp/retire.md
      - name: Remove entries retired more than 30 days ago
        run: python scripts/retire_models.py --apply --grace-days 30
      - name: Prove the catalogue still passes its guards
        run: python -m pytest tests/test_price_oracle.py tests/test_price_provenance.py tests/test_pricing_integrity.py -q
      - name: Open a PR when anything was removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.75.0: a retired registry-sourced entry is deleted from its
          # data/registry_models/<slug>.json rather than from a *_pricing.py.
          if git diff --quiet -- src/services data/registry_models; then
            echo "Nothing past the grace period — no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/retire-models-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add src/services data/registry_models
          git commit -m "chore(pricing): remove models retired by their provider"
          git push origin "$BRANCH"
          {
            printf 'Automated weekly retirement (`scripts/retire_models.py`). Each removed entry has a same-provider registry deprecation date at least 30 days in the past; the oracle has been withholding it from cost math since that date.\n\n'
            printf '## Verified before this PR was opened\n\nGitHub does not run CI on PRs created with `GITHUB_TOKEN`; these ran in the job that produced it: `tests/test_price_oracle.py`, `tests/test_price_provenance.py`, `tests/test_pricing_integrity.py`.\n\n'
            cat /tmp/retire.md
          } > /tmp/pr_body.md
          gh pr create \
            --title "chore(pricing): remove models retired by their provider" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."
      - name: Add the retirement report to the rolling audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --state open --label price-drift --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/retire.md
          else
            echo "No open price-drift issue; retirement report stays in this run's log."
          fi

  # v1.75.0 — registry pickup. Every chat model the registry prices under a
  # registry-backed catalogue provider that the catalogue does not list is
  # added to data/registry_models/<slug>.json as a registry-sourced entry
  # (price_source_kind "registry", registry key, registry date). Existing
  # entries are re-synced: price changed -> updated and listed; unchanged ->
  # re-dated; no longer in the registry -> left to age into stale. The script
  # never edits a *_pricing.py; a human merges the PR; nothing is promoted to
  # provider-confirmed automatically.
  #
  # The pickup reads the VENDORED SNAPSHOT (--snapshot-only), not the live
  # registry: the guard tests below price the catalogue against the snapshot,
  # so a key only the live registry knows would be added and then fail
  # test_pricing_integrity's oracle round-trip — the job could never succeed
  # when it had something new. New registry data arrives through the
  # refresh-snapshot PR above (validated, human-merged); the pickup picks it up
  # on the next weekly run after that merges.
  #
  # OWNER DECISION — staged rollout: the first runs cover ONLY the five
  # providers added in v1.75.0. Widen --providers in later weeks to let the
  # existing registry-backed providers pick up too.
  pickup:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pick up new registry models as registry-sourced entries
        run: |
          python scripts/pickup_registry_models.py --apply --markdown --snapshot-only \
            --providers 'DeepInfra,Novita,Vercel AI Gateway,Nebius,Databricks' | tee /tmp/pickup.md
      - name: Prove the catalogue still passes its guards
        run: |
          python -m pytest tests/test_price_oracle.py tests/test_price_provenance.py \
            tests/test_pricing_integrity.py tests/test_data_quality.py tests/test_registry_pickup.py -q
      - name: Open a PR when anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -A so a provider's first-ever JSON file (untracked) counts as a change.
          git add -A data/registry_models
          if git diff --cached --quiet -- data/registry_models; then
            echo "No new or changed registry models — no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/pickup-registry-models-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "feat(pricing): pick up new registry models as registry-sourced entries"
          git push origin "$BRANCH"
          {
            printf 'Automated weekly registry pickup (`scripts/pickup_registry_models.py --snapshot-only`, i.e. against the vendored `data/model_prices_snapshot.json` as last merged). Only `data/registry_models/*.json` changes — no curated `STATIC_PRICING` entry is created, modified or deleted. Every added model is a registry-sourced entry: it carries the registry'"'"'s price, its registry key and the registry date, is labelled `price_source_kind: registry`, and is usable in estimates and comparisons but never counted as provider-confirmed. Merging does not promote anything to provider-confirmed.\n\n'
            printf '## Verified before this PR was opened\n\nGitHub does not run CI on PRs created with `GITHUB_TOKEN`; these ran in the job that produced it: `tests/test_price_oracle.py`, `tests/test_price_provenance.py`, `tests/test_pricing_integrity.py`, `tests/test_data_quality.py`, `tests/test_registry_pickup.py`.\n\n'
            cat /tmp/pickup.md
          } > /tmp/pr_body.md
          gh pr create \
            --title "feat(pricing): pick up new registry models as registry-sourced entries" \
            --body-file /tmp/pr_body.md \
            --base develop \
            --head "$BRANCH" \
            || echo "gh pr create blocked — branch '$BRANCH' was pushed; open the PR manually."
