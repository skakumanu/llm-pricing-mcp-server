name: Bootstrap npm publish (one-time, token)

# TEMPORARY. Delete this file (and the NPM_TOKEN repository secret) once
# npm/llm-pricing-mcp exists on the registry and npm-publish.yml has made its
# first successful Trusted Publishing release.
#
# Why this exists: npm's Trusted Publisher setting can only be added to a
# package that already exists, so the very first publish cannot use OIDC.
# This workflow does that first publish with a short-lived Granular Access
# Token ("Bypass 2FA" enabled) stored as the NPM_TOKEN repository secret, so
# nothing has to be typed into a local CLI. It never runs on its own: manual
# `workflow_dispatch` only, and only from master.
#
# tests/test_npm_bootstrap_publish_workflow.py pins: dispatch-only, master-only,
# token read from secrets (never inline), and the banned OIDC triggers.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  bootstrap-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write   # for --provenance (SLSA attestation), not for auth
    defaults:
      run:
        working-directory: npm/llm-pricing-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Exact pin + check-latest so the publish never runs on a cached,
          # unpatched runner build (Oct 2026 Node security release: 24.22.1+).
          # tests/test_node_version_pins.py enforces the floor.
          node-version: 24.22.1
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Require the NPM_TOKEN secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN repository secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npm whoami

      - name: Decide whether this version needs publishing
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on the registry — will publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what will be published
        if: steps.check.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish (token auth, with provenance)
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Verify the version is live
        if: steps.check.outputs.publish == 'true'
        run: |
          NAME="${{ steps.check.outputs.name }}"
          VERSION="${{ steps.check.outputs.version }}"
          for attempt in $(seq 1 6); do
            if LIVE=$(npm view "$NAME@$VERSION" version 2>/dev/null) && [ "$LIVE" = "$VERSION" ]; then
              echo "OK: $NAME@$VERSION is live on the registry"
              echo "Next: add the Trusted Publisher on npmjs.com (workflow npm-publish.yml) within 48h,"
              echo "      then delete this workflow and the NPM_TOKEN secret."
              exit 0
            fi
            echo "Attempt $attempt/6: not visible yet, waiting..."
            sleep 10
          done
          echo "ERROR: $NAME@$VERSION did not appear on the registry after publish"
          exit 1
