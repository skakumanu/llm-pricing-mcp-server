# fly.toml — Fly.io app configuration for llm-pricing-api
# Deploy: flyctl deploy --remote-only
# Docs: https://fly.io/docs/reference/configuration/

app = 'llm-pricing-api'
primary_region = 'iad'

[build]
  # Uses the existing Dockerfile unchanged

[env]
  # SQLite DB stored on the persistent volume mounted at /app/data
  PRICING_HISTORY_DB_PATH = "/app/data/pricing_history.db"
  # Customer accounts (and their service keys) must survive redeploys too. Unset,
  # BILLING_DB_PATH defaults to the relative "billing.db", i.e. /app/billing.db on
  # the image's ephemeral disk, not on the volume (v1.78.1).
  BILLING_DB_PATH = "/app/data/billing.db"
  # The volume mount shadows the image's /app/data, so the vendored
  # exchange-rate table is read from the copy the Dockerfile puts outside it.
  EXCHANGE_RATES_PATH = "/app/vendored/exchange_rates.json"
  # Orchestrator core (v1.83.0): runs, approvals, action records, spend and settings.
  # ORCHESTRATOR_INTAKE_KEY is a Fly secret, never set here.
  ORCHESTRATOR_DB_PATH = "/app/data/orchestrator.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'llm_pricing_data'
  destination = '/app/data'
